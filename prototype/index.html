<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aircraft Deal Assistant (prototype)</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1b2330; --muted:#667085; --accent:#0b5cff; --warn:#b54708; --ok:#067647; --line:#e4e7ec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161d; --card:#1b212b; --text:#e8ecf2; --muted:#98a2b3; --line:#2d3544; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:900px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; } h2 { font-size:16px; margin:0 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:var(--muted); margin-top:8px; }
  input, select, textarea { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:0 12px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 14px; font:inherit; cursor:pointer; margin:8px 8px 0 0; }
  button.secondary { background:transparent; color:var(--text); border:1px solid var(--line); }
  .match { border:1px solid var(--line); border-radius:8px; padding:10px; margin-top:8px; }
  .tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
  .warn { color:var(--warn); } .ok { color:var(--ok); }
  .banner { border-left:4px solid var(--warn); padding:8px 12px; background:var(--bg); margin-bottom:16px; font-size:13px; }
  .hidden { display:none; }
  pre { white-space:pre-wrap; margin:0; font:inherit; }
</style>
</head>
<body>
<main>
  <h1>Aircraft Deal Assistant <span class="tag">prototype</span></h1>
  <div class="banner">Demo data and rule-based drafting. Every message is a <b>draft</b> that needs broker approval before it would be sent. No real sanctions screening.</div>

  <section class="card">
    <h2>1. Buyer inquiry</h2>
    <form id="intake">
      <div class="grid">
        <div><label>Name<input id="name" required value="Alex Morgan"></label></div>
        <div><label>Company<input id="company" value="Northwind Air"></label></div>
        <div><label>Country<input id="country" value="Spain"></label></div>
        <div><label>Buy or lease<select id="mode"><option value="buy">Buy</option><option value="lease">Lease</option></select></label></div>
        <div><label>Aircraft type<select id="type"><option value="any">Any</option><option>turboprop</option><option>light jet</option><option>regional jet</option></select></label></div>
        <div><label>Min seats<input id="seats" type="number" value="60"></label></div>
        <div><label>Min range (nm)<input id="range" type="number" value="700"></label></div>
        <div><label>Max age (years)<input id="age" type="number" value="20"></label></div>
        <div><label>Budget (USD, per month if leasing)<input id="budget" type="number" value="9000000"></label></div>
      </div>
      <button>Screen and find matches</button>
    </form>
    <div id="screenResult"></div>
  </section>

  <section class="card hidden" id="matchesCard">
    <h2>2. Matches</h2>
    <div id="matches"></div>
  </section>

  <section class="card hidden" id="negCard">
    <h2>3. Negotiation</h2>
    <div id="negTitle"></div>
    <div class="grid">
      <div><label>Buyer's offer (USD)<input id="offer" type="number"></label></div>
      <div id="termWrap" class="hidden"><label>Lease term (months)<input id="term" type="number" value="36"></label></div>
    </div>
    <button id="submitOffer">Submit buyer's offer</button>
    <div id="draftBox" class="hidden">
      <h2 style="margin-top:16px">Draft reply (awaiting approval)</h2>
      <p id="draftMeta"></p>
      <textarea id="draftText" rows="5"></textarea>
      <p id="draftNote" class="warn"></p>
      <button id="approve">Approve and send</button>
      <button id="reject" class="secondary">Reject draft</button>
    </div>
  </section>

  <section class="card">
    <h2>Activity log</h2>
    <pre id="log">Nothing yet.</pre>
  </section>
</main>
<script src="logic.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let req, selected, round = 0, currentDraft;
const logLines = [];
function log(msg) { logLines.push(new Date().toLocaleTimeString() + '  ' + msg); $('log').textContent = logLines.join('\n'); }

$('intake').addEventListener('submit', (e) => {
  e.preventDefault();
  const s = Logic.screen({ country: $('country').value });
  if (!s.ok) {
    $('screenResult').innerHTML = '<p class="warn">Escalated to compliance: ' + s.reason + '. No automated reply.</p>';
    $('matchesCard').classList.add('hidden'); $('negCard').classList.add('hidden');
    log('Screening failed for ' + $('name').value + ' (' + $('country').value + '). Escalated.');
    return;
  }
  $('screenResult').innerHTML = '<p class="ok">Screening passed (demo).</p>';
  req = { mode: $('mode').value, type: $('type').value, seats: +$('seats').value, rangeNm: +$('range').value, maxAge: +$('age').value, budget: +$('budget').value };
  const results = Logic.matchAircraft(req);
  $('matchesCard').classList.remove('hidden'); $('negCard').classList.add('hidden');
  $('matches').innerHTML = results.length ? '' : '<p>No matching aircraft. Broker to source inventory.</p>';
  results.forEach((m) => {
    const a = m.aircraft, price = req.mode === 'lease' ? Logic.fmt(a.leaseMonthly) + '/month' : Logic.fmt(a.listPrice);
    const div = document.createElement('div'); div.className = 'match';
    div.innerHTML = `<b>${a.model}</b> <span class="tag">${a.id}</span> <span class="tag">match ${m.score}</span><br>
      ${a.year}, ${a.hours.toLocaleString()} hrs, ${a.seats} seats, ${a.rangeNm} nm, ${a.location}. Asking ${price}.<br>
      ${m.reasons.length ? '<span class="warn">' + m.reasons.join(', ') + '</span><br>' : ''}`;
    const b = document.createElement('button'); b.className = 'secondary'; b.textContent = 'Negotiate';
    b.onclick = () => startNeg(a);
    div.appendChild(b); $('matches').appendChild(div);
  });
  log('Intake from ' + $('name').value + ': ' + results.length + ' match(es).');
});

function startNeg(a) {
  selected = a; round = 0;
  $('negCard').classList.remove('hidden'); $('draftBox').classList.add('hidden');
  $('negTitle').innerHTML = '<p>' + a.model + ' (' + a.id + '), asking ' + (req.mode === 'lease' ? Logic.fmt(a.leaseMonthly) + '/month' : Logic.fmt(a.listPrice)) + '</p>';
  $('termWrap').classList.toggle('hidden', req.mode !== 'lease');
  $('offer').value = '';
  log('Started negotiation on ' + a.id + '.');
}

$('submitOffer').onclick = () => {
  const offer = +$('offer').value;
  if (!offer) return;
  round++;
  currentDraft = Logic.negotiate({ aircraft: selected, mode: req.mode, offer, round, termMonths: req.mode === 'lease' ? +$('term').value : undefined });
  $('draftBox').classList.remove('hidden');
  $('draftMeta').innerHTML = 'Round ' + round + '. Action: <b>' + currentDraft.action + '</b>' + (currentDraft.flags.length ? '<br><span class="warn">' + currentDraft.flags.join(' ') + '</span>' : '');
  $('draftText').value = currentDraft.message;
  $('draftNote').textContent = 'Internal note: ' + currentDraft.internalNote;
  log('Buyer offered ' + Logic.fmt(offer) + '. Drafted ' + currentDraft.action + ' (not sent).');
};
$('approve').onclick = () => {
  log('APPROVED and sent: "' + $('draftText').value + '"');
  $('draftBox').classList.add('hidden'); $('offer').value = '';
  if (currentDraft.action === 'accept') log('Next: prepare letter of intent (human).');
};
$('reject').onclick = () => { log('Draft rejected by broker.'); $('draftBox').classList.add('hidden'); };
</script>
</body>
</html>
